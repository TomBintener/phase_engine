[package]
name = "egglog_python"
version = "13.1.0"
edition = "2024"

[lib]
name = "egglog"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module", "num-bigint", "num-rational", "indexmap"] }
num-bigint = "*"
num-rational = "*"
indexmap = "2.12"
opentelemetry = "0.28"
opentelemetry-otlp = { version = "0.28", features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry-stdout = { version = "0.28", features = ["trace"] }
opentelemetry_sdk = "0.28"
# This directory lives inside TomBintener/phase_engine; compile PathSum from
# the parent crate (I_n-only), not egraphs-good/egglog or a sibling ../egglog.
egglog = { path = "..", default-features = false }
egglog-ast = { path = "../egglog-ast" }
egglog-core-relations = { path = "../core-relations" }
egglog-reports = { path = "../egglog-reports" }
egglog-bridge = { path = "../egglog-bridge" }

egraph-serialize = { version = "0.3", features = ["serde", "graphviz"] }
serde_json = "1"
pyo3-log = "*"
log = "0.4"
lalrpop-util = { version = "0.22", features = ["lexer"] }
ordered-float = "5"
tracing = "0.1"
tracing-opentelemetry = "0.29"
tracing-subscriber = "0.3"
uuid = { version = "1.18", features = ["v4"] }
rayon = "1.11"
base64 = "0.22.1"

[patch.'https://github.com/egraphs-good/egglog']
egglog = { path = ".." }

[profile.release]
debug = true
